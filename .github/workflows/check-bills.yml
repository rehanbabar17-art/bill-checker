name: Check Utility Bills

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: read

concurrency:
  group: bill-checker
  cancel-in-progress: false

jobs:
  check-bills:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install B2 dependencies
        run: npm ci

      - name: Install bill-checker dependencies
        run: pip install 'requests[socks]'

      - name: Download private bill data from B2
        id: b2_download
        env:
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
        run: npm run b2:download

      - name: Check bills
        id: check_bills
        env:
          NTFY_KEY: ${{ secrets.NTFY_KEY }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          PROXY_URLS: ${{ secrets.PROXY_URLS }}
          PROXY_ONLY: ${{ vars.PROXY_ONLY }}
        run: python check_bills.py

      - name: Upload updated private bill data to B2
        if: ${{ always() && steps.b2_download.outcome == 'success' && steps.check_bills.outcome == 'success' }}
        env:
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
        run: npm run b2:upload

      - name: Secure cleanup of local private data
        if: always()
        run: rm -f config.json bill_state.json config.json.*.tmp bill_state.json.*.tmp
